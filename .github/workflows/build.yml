name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model tests
        run: make test

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Rack SDK
        run: |
          for name in "mac-arm64" "mac-x64%2Barm64" "mac-x64+arm64"; do
            url="https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${name}.zip"
            if curl -sSfL "$url" -o sdk.zip; then echo "Got $url"; break; fi
            echo "Not found: $url"
          done
          unzip -q sdk.zip -d "$RUNNER_TEMP"
      - name: Build
        run: |
          export RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          make -j3 dist CC=clang CXX=clang++
      - name: Check for unresolved plugin symbols
        run: |
          # Anything of ours left undefined would make Rack refuse to load the plugin.
          if nm -u plugin.dylib | c++filt | grep -E "tx::|TETRA|PLINK"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Tetrax-mac-arm64
          path: dist/*.vcvplugin

  release:
    # Releases come from main: the tag is taken from plugin.json's version, so no tag push is needed.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-mac-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Tetrax v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*.vcvplugin
